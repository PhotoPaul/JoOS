<ng-container *ngIf="applicationData">
    <data-panel ngId="threeYearSubmissionInfo" [heading]="'submission' | l" color="portlet-blue" [collapsed]="true">
        <fieldset [disabled]="formLoading">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="submissionDateInput">{{ 'date' | l }}</label>
                        <input type="text" [(ngModel)]="applicationData.application.submissionDate" id="submissionDateInput" name="submissionDate" class="form-control" placeholder="e.g. DD-MM-YYYY" required>
                        <required-field-warning *ngIf="validate && !applicationData.application.submissionDate"></required-field-warning>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentSignatureInput">{{ 'studentSignature' | l }}</label>
                        <input type="text" [(ngModel)]="applicationData.application.studentSignature" id="studentSignatureInput" name="studentSignature" class="form-control" required>
                        <required-field-warning *ngIf="validate && !applicationData.application.studentSignature"></required-field-warning>
                    </div>
                </div>
            </div>

            <div class="row" style="margin-top: 20px;">
                <div class="col-md-4 col-md-offset-4">
                    <button class="btn btn-green btn-block" type="button" (click)="onSave('threeYearSubmissionInfo', null)">{{ 'saveAndContinue' | l }}</button>
                </div>
            </div>
        </fieldset>
    </data-panel>
</ng-container>

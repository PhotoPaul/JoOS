<ng-container *ngIf="applicationData">
    <data-panel ngId="threeYearFinancialInfo" [heading]="'financialLiability2' | l" color="portlet-blue" [collapsed]="applicationData?.application?.applicationStatus != '1'">
        <fieldset [disabled]="formLoading">
            <!-- Student Type -->
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="studentTypeRadio">{{ 'studentType' | l }}</label><br>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="applicationData.application.studentType" name="studentType" value="studentExternal" required>&nbsp;{{ 'studentExternal' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="applicationData.application.studentType" name="studentType" value="studentInternal" required>&nbsp;{{ 'studentInternal' | l }}</label>
                        <required-field-warning *ngIf="validate && !applicationData.application.studentType" [warningText]="'requiredChoice' | l"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- Funding Source -->
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="fundingSourceRadio">{{ 'fundingSource' | l }}</label><br>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="applicationData.application.fundingSource" name="fundingSource" value="fundingSelf" required>&nbsp;{{ 'fundingSelf' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="applicationData.application.fundingSource" name="fundingSource" value="fundingThirdParty" required>&nbsp;{{ 'fundingThirdParty' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="applicationData.application.fundingSource" name="fundingSource" value="fundingPartial" required>&nbsp;{{ 'fundingPartial' | l }}</label>
                        <required-field-warning *ngIf="validate && !applicationData.application.fundingSource" [warningText]="'requiredChoice' | l"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- Sponsor Details (Sponsor / Partial) -->
            <div *ngIf="applicationData.application.fundingSource === 'fundingThirdParty' || applicationData.application.fundingSource === 'fundingPartial'">
                <h4 style="font-weight: bold; margin-top: 20px; border-bottom: 1px solid #eee; padding-bottom: 5px;">{{ 'sponsorDetails' | l }}</h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorNameInput">{{ 'sponsorName' | l }}</label>
                            <input type="text" [(ngModel)]="applicationData.application.sponsorName" id="sponsorNameInput" name="sponsorName" class="form-control" required>
                            <required-field-warning *ngIf="validate && !applicationData.application.sponsorName"></required-field-warning>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorPhoneInput">{{ 'sponsorPhone' | l }}</label>
                            <input type="text" [(ngModel)]="applicationData.application.sponsorPhone" id="sponsorPhoneInput" name="sponsorPhone" class="form-control" required>
                            <required-field-warning *ngIf="validate && !applicationData.application.sponsorPhone"></required-field-warning>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorAmountInput">{{ 'sponsorAmount' | l }}</label>
                            <input type="text" [(ngModel)]="applicationData.application.sponsorAmount" id="sponsorAmountInput" name="sponsorAmount" class="form-control" required>
                            <required-field-warning *ngIf="validate && !applicationData.application.sponsorAmount"></required-field-warning>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Student Remaining Amount (Partial) -->
            <div *ngIf="applicationData.application.fundingSource === 'fundingPartial'" class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentAmountInput">{{ 'studentAmount' | l }}</label>
                        <input type="text" [(ngModel)]="applicationData.application.studentAmount" id="studentAmountInput" name="studentAmount" class="form-control" required>
                        <required-field-warning *ngIf="validate && !applicationData.application.studentAmount"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- Church / Mission Details -->
            <div *ngIf="applicationData.application.fundingSource === 'fundingThirdParty' || applicationData.application.fundingSource === 'fundingPartial'" class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="churchMissionDetailsInput">{{ 'churchMissionDetails' | l }}</label>
                        <textarea [(ngModel)]="applicationData.application.churchMissionDetails" id="churchMissionDetailsInput" name="churchMissionDetails" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div *ngIf="applicationData?.application?.applicationStatus != '1'" class="row" style="margin-top: 20px;">
                <div class="col-md-4 col-md-offset-4">
                    <button class="btn btn-green btn-block" type="button" (click)="onSave('threeYearFinancialInfo', 'threeYearCallingInfo')">{{ 'saveAndContinue' | l }}</button>
                </div>
            </div>
        </fieldset>
    </data-panel>
</ng-container>

<ng-container *ngIf="registrationData">
    <data-panel ngId="regFinancialInfo" [heading]="'financialLiability2' | l" color="portlet-blue" [collapsed]="registrationData?.application?.applicationStatus != '1'">
        <fieldset [disabled]="formLoading">
            <!-- Back Office / Accounting Notes (Staff Only) -->
            <div *authIf="['admin', 'registrar', 'cashier']" class="row" style="margin-bottom: 15px;">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="financialNotesInput"><i class="fas fa-lock text-muted" style="margin-right: 5px;"></i>{{ 'accountingNotes' | l }}</label>
                        <textarea [(ngModel)]="registrationData.application.financialNotes" id="financialNotesInput" name="financialNotes" class="form-control" rows="3" autocomplete="off"></textarea>
                    </div>
                </div>
            </div>

            <!-- 1. Student Type (Επιλέξτε ποιο περιγράφει την κατάστασή σας) -->
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="studentTypeRadio">{{ 'studentType' | l }}</label><br>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="registrationData.application.studentType" name="studentType" value="studentExternal" required>&nbsp;{{ 'studentExternal' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="registrationData.application.studentType" name="studentType" value="studentInternal" required>&nbsp;{{ 'studentInternal' | l }}</label>
                        <required-field-warning *ngIf="validate && !registrationData.application.studentType" [warningText]="'requiredChoice' | l"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- 2. Funding Source (Κάλυψη κόστους φοίτησης (και διαμονής)) -->
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="fundingSourceRadio">{{ 'fundingSource' | l }}</label><br>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="registrationData.application.fundingSource" name="fundingSource" value="fundingSelf" required>&nbsp;{{ 'fundingSelf' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="registrationData.application.fundingSource" name="fundingSource" value="fundingThirdParty" required>&nbsp;{{ 'fundingThirdParty' | l }}</label>
                        <label class="radio-inline"><input type="radio" [(ngModel)]="registrationData.application.fundingSource" name="fundingSource" value="fundingPartial" required>&nbsp;{{ 'fundingPartial' | l }}</label>
                        <required-field-warning *ngIf="validate && !registrationData.application.fundingSource" [warningText]="'requiredChoice' | l"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- 3. Sponsor Details (Στοιχεία Χορηγού if applicable) -->
            <div *ngIf="registrationData.application.fundingSource === 'fundingThirdParty' || registrationData.application.fundingSource === 'fundingPartial'">
                <h4 style="font-weight: bold; margin-top: 20px; border-bottom: 1px solid #eee; padding-bottom: 5px;">{{ 'sponsorDetails' | l }}</h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorNameInput">{{ 'sponsorName' | l }}</label>
                            <input type="text" [(ngModel)]="registrationData.application.sponsorName" id="sponsorNameInput" name="sponsorName" class="form-control" required>
                            <required-field-warning *ngIf="validate && !registrationData.application.sponsorName"></required-field-warning>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorPhoneInput">{{ 'sponsorPhone' | l }}</label>
                            <input type="text" [(ngModel)]="registrationData.application.sponsorPhone" id="sponsorPhoneInput" name="sponsorPhone" class="form-control" required>
                            <required-field-warning *ngIf="validate && !registrationData.application.sponsorPhone"></required-field-warning>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="sponsorAmountInput">{{ 'sponsorAmount' | l }}</label>
                            <input type="text" [(ngModel)]="registrationData.application.sponsorAmount" id="sponsorAmountInput" name="sponsorAmount" class="form-control" required>
                            <required-field-warning *ngIf="validate && !registrationData.application.sponsorAmount"></required-field-warning>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Student Remaining Amount (Partial) -->
            <div *ngIf="registrationData.application.fundingSource === 'fundingPartial'" class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentAmountInput">{{ 'studentAmount' | l }}</label>
                        <input type="text" [(ngModel)]="registrationData.application.studentAmount" id="studentAmountInput" name="studentAmount" class="form-control" required>
                        <required-field-warning *ngIf="validate && !registrationData.application.studentAmount"></required-field-warning>
                    </div>
                </div>
            </div>

            <!-- Church / Mission Details -->
            <div *ngIf="registrationData.application.fundingSource === 'fundingThirdParty' || registrationData.application.fundingSource === 'fundingPartial'" class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="churchMissionDetailsInput">{{ 'churchMissionDetails' | l }}</label>
                        <textarea [(ngModel)]="registrationData.application.churchMissionDetails" id="churchMissionDetailsInput" name="churchMissionDetails" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- 4. Tuition Costs (Κόστος Διδάκτρων) -->
            <div class="row" style="margin-top: 15px; margin-bottom: 15px;">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="financialCostInput">{{ 'tuitionCosts' | l }}</label>
                        <textarea *authIf="['admin', 'registrar', 'cashier']" [(ngModel)]="registrationData.application.financialCost" id="financialCostInput" name="financialCost" class="form-control" rows="4" autocomplete="off"></textarea>
                        <textarea *authIf="'candidate'" [value]="registrationData.application.financialCost || ''" id="financialCostInput" name="financialCost" class="form-control" rows="4" readonly></textarea>
                    </div>
                </div>
            </div>

            <!-- 5. Financial Liability Approval (Γνωρίζετε το κόστος...) -->
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group"
                         [style.border-left]="!registrationData.application.financialLiabilityApproval ? '5px solid #e74c3c' : '5px solid transparent'"
                         [style.padding-left]="!registrationData.application.financialLiabilityApproval ? '10px' : '0px'"
                         style="transition: border-color 0.2s ease;">
                        <label for="financialLiabilityApprovalCheckbox">{{ 'financialApproval2' | l }}</label><br>
                        <label class="checkbox-inline">
                            <input type="checkbox" [(ngModel)]="registrationData.application.financialLiabilityApproval" id="financialLiabilityApprovalCheckbox" name="financialLiabilityApproval" required>&nbsp;{{ 'yes' | l }}
                        </label>
                        <required-field-warning *ngIf="validate && !registrationData.application.financialLiabilityApproval" [warningText]="'requiredChoice' | l"></required-field-warning>
                    </div>
                </div>
            </div>

            <div *ngIf="registrationData?.application?.applicationStatus != '1'" class="row" style="margin-top: 20px;">
                <div class="col-md-4 col-md-offset-4">
                    <button class="btn btn-green btn-block" type="button" (click)="onSave('regFinancialInfo', null)">{{ 'saveAndContinue' | l }}</button>
                </div>
            </div>
        </fieldset>
    </data-panel>
</ng-container>
